name: publish

on:
  workflow_dispatch:
    inputs:
      payload:
        description: Base64 status document
        required: true
        type: string
      signature:
        description: Lowercase hex HMAC-SHA256 of the decoded payload
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: status-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Unlike the validation job, this checkout must retain credentials: the
      # final step pushes the commit. The toolchain checkouts below are
      # read-only and drop them.
      - name: Checkout status
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the pinned status toolchain
        uses: ./.github/actions/toolchain

      - name: Verify the signed payload
        env:
          STATUS_HEARTBEAT_HMAC: ${{ secrets.STATUS_HEARTBEAT_HMAC }}
          PAYLOAD: ${{ inputs.payload }}
          SIGNATURE: ${{ inputs.signature }}
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import hmac
          import os
          import sys
          from pathlib import Path

          key = os.environ.get("STATUS_HEARTBEAT_HMAC", "")
          if not key:
              sys.exit("STATUS_HEARTBEAT_HMAC is not configured")
          try:
              payload = base64.b64decode(os.environ["PAYLOAD"], validate=True)
          except (ValueError, KeyError) as exc:
              sys.exit(f"payload is not base64: {exc}")
          if len(payload) > 65536:
              sys.exit("payload exceeds 64 KiB")
          expected = hmac.new(key.encode("utf-8"), payload, hashlib.sha256).hexdigest()
          if not hmac.compare_digest(expected, os.environ.get("SIGNATURE", "")):
              sys.exit("signature mismatch")
          if not payload.endswith(b"\n"):
              sys.exit("payload must end with a newline")
          Path("status.json").write_bytes(payload)
          PY

      # The generator, renderer, and retention writer are the same commands a
      # developer runs. Pruning runs before the commit so an expired asset can
      # never be published by a heartbeat.
      - name: Rebuild the generated site and prune retired assets
        run: make brand

      # This is the exact CI gate: the Makefile owns the check list.
      - name: Run the same validation gate as CI
        run: make validate

      - name: Commit the heartbeat
        run: |
          git config user.name "SBK status publisher"
          git config user.email "status@sbktechno.com"
          git add status.json index.html site.manifest.json assets asset-retention.json
          if git diff --cached --quiet; then
            echo "status unchanged"
            exit 0
          fi
          git commit -m "chore(status): publish signed heartbeat"
          git push
