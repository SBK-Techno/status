name: publish

on:
  workflow_dispatch:
    inputs:
      payload:
        description: Base64 status document
        required: true
        type: string
      signature:
        description: Lowercase hex HMAC-SHA256 of the decoded payload
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: status-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Unlike the validation job, this checkout must retain credentials: the
      # final step pushes the commit. The toolchain checkouts below are
      # read-only and drop them.
      - name: Checkout status
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the pinned status toolchain
        uses: ./.github/actions/toolchain
        with:
          platform_read_key: ${{ secrets.PLATFORM_READ_KEY }}
          brand_read_key: ${{ secrets.BRAND_READ_KEY }}

      # The verifier and the post-publish check share
      # scripts/heartbeat_signature.py, so the publish-time HMAC contract has
      # one owner and cannot drift from `make verify-published`.
      - name: Verify the signed payload
        env:
          STATUS_HEARTBEAT_HMAC: ${{ secrets.STATUS_HEARTBEAT_HMAC }}
          PAYLOAD: ${{ inputs.payload }}
          SIGNATURE: ${{ inputs.signature }}
        run: python3 scripts/verify_heartbeat.py --out status.json

      # The generator, renderer, and retention writer are the same commands a
      # developer runs. Pruning runs before the decision so an expired asset can
      # never be published by a heartbeat.
      - name: Rebuild the generated site and prune retired assets
        run: make brand

      # The script owns the no-op contract: it compares the publish surface
      # with the published commit and reports whether this heartbeat changes
      # anything. A duplicate payload, or a rebuild that only moved the
      # snapshot instant, sets changed=false below and publishes nothing.
      - name: Decide whether this heartbeat changes the published site
        id: publish
        run: make publish-check PUBLISH_DECISION_FILE="$GITHUB_OUTPUT"

      # This is the exact CI gate: the Makefile owns the check list. A no-op
      # stops here, so it neither validates nor commits, and Pages never sees
      # an empty heartbeat commit.
      - name: Run the same validation gate as CI
        if: steps.publish.outputs.changed == 'true'
        run: make validate

      - name: Commit the heartbeat
        if: steps.publish.outputs.changed == 'true'
        run: |
          git config user.name "SBK status publisher"
          git config user.email "status@sbktechno.com"
          git add -A
          git commit -m "chore(status): publish signed heartbeat"
          git push
