name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate the static status site
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The brand generator and linter are the platform's source of truth for
      # the shared shell. They are read-only inputs, not a second copy of the
      # brand contract in this repository.
      - name: Check out the platform toolchain
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SBK-Techno/platform
          path: .toolchain/platform
          persist-credentials: false

      - name: Check out the brand layer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SBK-Techno/brand
          path: .toolchain/brand
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .toolchain/platform/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: .toolchain/platform/go.sum

      - name: Validate the document, snapshot, brand link, and print block
        run: make validate PLATFORM=.toolchain/platform BRAND=.toolchain/brand

      - name: Lint the brand surface
        working-directory: .toolchain/platform
        run: go run ./cmd/brandlint -root . -brand ../brand -status ../..
