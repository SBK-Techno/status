name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate the static status site
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify the generated brand assets
        run: |
          python3 - <<'PY'
          import hashlib
          import re
          import json
          import sys
          from pathlib import Path

          manifest = json.loads(Path("brand.manifest.json").read_text(encoding="utf-8"))
          if manifest.get("version") != 1 or not manifest.get("generatedBy"):
              sys.exit("brand.manifest.json must declare version 1 and generatedBy")
          assets = manifest.get("assets")
          if not isinstance(assets, list) or not assets:
              sys.exit("brand.manifest.json must declare assets")

          pages = {name: Path(name).read_text(encoding="utf-8") for name in ("index.html", "404.html")}
          for name, text in pages.items():
              if "{{asset:" in text:
                  sys.exit(f"{name}: unresolved brand placeholder")

          # An asset is referenced either from a page or from a stylesheet the
          # page links. A font is never in the HTML: it is named by an
          # @font-face rule, so requiring an HTML reference would reject a
          # correctly published font.
          stylesheets = {}
          for text in pages.values():
              for match in re.findall(r'<link[^>]+href="([^"]+\.css)"', text):
                  candidate = Path(match)
                  if candidate.is_file():
                      stylesheets[match] = candidate.read_text(encoding="utf-8")

          for asset in assets:
              if not asset.get("publish"):
                  continue
              path = Path(asset["file"])
              if not path.is_file():
                  sys.exit(f"{path}: missing")
              data = path.read_bytes()
              if hashlib.sha256(data).hexdigest() != asset["sha256"]:
                  sys.exit(f"{path}: digest mismatch")
              if len(data) != asset["bytes"]:
                  sys.exit(f"{path}: size mismatch")
              if not any(asset["file"] in text for text in list(pages.values()) + list(stylesheets.values())):
                  sys.exit(f"{asset['file']}: published but not referenced by any page or stylesheet")

          print(f"brand manifest ok: {len(assets)} assets")
          PY

      - name: Validate status data and static assets
        run: python3 scripts/validate_status.py

      - name: Test the status validator
        run: python3 -m unittest discover -s scripts -p '*_test.py'
