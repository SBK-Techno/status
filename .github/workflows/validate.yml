name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: status-validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate the static status site
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The generator, linter, and status checker are the platform's source of
      # truth. They are read-only inputs, not a second copy of the status or
      # brand contract in this repository. The composite action records the
      # exact platform and brand commits so local and CI builds agree.
      - name: Set up the pinned status toolchain
        uses: ./.github/actions/toolchain
        with:
          platform_read_key: ${{ secrets.PLATFORM_READ_KEY }}
          brand_read_key: ${{ secrets.BRAND_READ_KEY }}

      - name: Run the local validation gate
        run: make validate
