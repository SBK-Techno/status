name: Status toolchain
description: Check out the pinned platform and brand inputs and install Go.

inputs:
  platform_read_key:
    description: Read-only deploy key for SBK-Techno/platform.
    required: true
  brand_read_key:
    description: Read-only deploy key for SBK-Techno/brand.
    required: true

runs:
  using: composite
  steps:
    - name: Check out the platform toolchain
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: SBK-Techno/platform
        ref: 76a882a454c1e4ececb456c256506e852fcdc987
        path: .toolchain/platform
        # SBK-Techno/platform is private. The repository secret holds a
        # read-only deploy key; no credential lives in this checkout.
        ssh-key: ${{ inputs.platform_read_key }}
        persist-credentials: false

    - name: Check out the brand layer
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: SBK-Techno/brand
        ref: 0c2ed17b3fba9048c0b2bf016a4074f3eb761c27
        path: .toolchain/brand
        # SBK-Techno/brand is private too; the deploy key is read-only.
        ssh-key: ${{ inputs.brand_read_key }}
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: .toolchain/platform/go.mod
        check-latest: false
        cache: true
        cache-dependency-path: .toolchain/platform/go.sum
